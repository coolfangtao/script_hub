<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1688 采集</title>
    <script src="tailwind.js"></script>
    <style>
        body {
            width: 300px;
            height: auto;
        }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
          -webkit-appearance: none;
          margin: 0;
        }
        input[type=number] {
          -moz-appearance: textfield;
        }
    </style>
</head>
<body class="font-sans antialiased bg-gray-50 p-4">

    <div class="space-y-4">
        <div class="flex items-center space-x-2">
            <img src="icon48.png" alt="icon" class="w-8 h-8">
            <h1 class="text-lg font-bold text-gray-800">1688采集助手</h1>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">采集模式</label>
            <fieldset class="mt-1">
                <div class="flex space-x-4">
                    <div class="flex items-center">
                        <input id="modeCategory" name="scrapeMode" type="radio" value="category"
                               class="focus:ring-blue-500 h-4 w-4 text-blue-600 border-gray-300"
                               checked>
                        <label for="modeCategory" class="ml-2 block text-sm text-gray-900">
                            类目采集 (翻页)
                        </label>
                    </div>
                    <div class="flex items-center">
                        <input id="modeRanking" name="scrapeMode" type="radio" value="ranking"
                               class="focus:ring-blue-500 h-4 w-4 text-blue-600 border-gray-300">
                        <label for="modeRanking" class="ml-2 block text-sm text-gray-900">
                            榜单采集 (滚动)
                        </label>
                    </div>
                </div>
            </fieldset>
        </div>

        <div id="categoryOptions">
            <label for="pageLimitInput" class="block text-sm font-medium text-gray-700">采集页数</label>
            <input type="number" id="pageLimitInput"
                   class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm
                          focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                   placeholder="例如: 3 (留空则采集全部)"
                   min="1">
        </div>

        <button id="scrapeButton"
                class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-md shadow-lg
                       hover:bg-blue-700 active:bg-blue-800
                       disabled:bg-gray-400 disabled:cursor-not-allowed
                       transition-colors duration-150 ease-in-out">
            开始采集
        </button>

        <div id="status"
             class="text-center text-sm font-medium text-green-700 h-6">
             </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
